<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Research Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --header-bg: rgba(15, 23, 42, 0.8);
            --card-bg: #151c2c;
            --card-border: rgba(255, 255, 255, 0.08);
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --user-bubble: #312e81;
            --assistant-bubble: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Header */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 2rem;
            background: var(--header-bg);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--card-border);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .brand-logo {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1rem;
            color: #fff;
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.3);
        }

        .brand-title h1 {
            font-size: 1.15rem;
            font-weight: 600;
            color: #ffffff;
        }

        .brand-title p {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        /* Container */
        .app-container {
            max-width: 880px;
            width: 100%;
            margin: 0 auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
        }

        /* Messages Area */
        .chat-box {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            padding-bottom: 2rem;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.15) transparent;
        }

        /* Message Rows */
        .msg-row {
            display: flex;
            gap: 0.9rem;
            animation: slideUp 0.25s ease-out;
        }

        .msg-row.user {
            justify-content: flex-end;
        }

        .avatar {
            width: 34px;
            height: 34px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 600;
            flex-shrink: 0;
        }

        .user .avatar {
            background: #4338ca;
            color: #fff;
        }

        .assistant .avatar {
            background: #6366f1;
            color: #fff;
        }

        .msg-content {
            max-width: 82%;
            padding: 1.1rem 1.3rem;
            border-radius: 14px;
            line-height: 1.6;
            font-size: 0.93rem;
            position: relative;
        }

        .user .msg-content {
            background: var(--user-bubble);
            border-bottom-right-radius: 3px;
            color: #fff;
        }

        .assistant .msg-content {
            background: var(--assistant-bubble);
            border: 1px solid var(--card-border);
            border-bottom-left-radius: 3px;
            color: #e2e8f0;
        }

        .msg-content p {
            margin-bottom: 0.6rem;
        }

        .msg-content p:last-child {
            margin-bottom: 0;
        }

        .msg-content ul, .msg-content ol {
            margin-left: 1.2rem;
            margin-bottom: 0.6rem;
        }

        .msg-content li {
            margin-bottom: 0.3rem;
        }

        /* Header in Response */
        .res-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.6rem;
            padding-bottom: 0.4rem;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        .res-tag {
            font-size: 0.75rem;
            color: #818cf8;
            font-weight: 500;
        }

        .copy-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 0.75rem;
            cursor: pointer;
            transition: color 0.2s;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .copy-btn:hover {
            color: #ffffff;
        }

        /* Typing / Loader */
        .loader-container {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            color: var(--text-muted);
            font-size: 0.88rem;
        }

        .typing-dots {
            display: flex;
            gap: 4px;
        }

        .typing-dots span {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #818cf8;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
        .typing-dots span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }

        /* Input Box */
        .input-area {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 0.5rem 0.6rem 0.5rem 1.1rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .input-area textarea {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-family: inherit;
            font-size: 0.93rem;
            resize: none;
            max-height: 120px;
            height: 24px;
            line-height: 1.5;
        }

        .input-area textarea::placeholder {
            color: var(--text-muted);
        }

        .send-btn {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: var(--primary);
            border: none;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .send-btn:hover {
            background: var(--primary-hover);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .send-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* New Research Button */
        .new-chat-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            padding: 0.5rem 0.9rem;
            border-radius: 10px;
            font-size: 0.82rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            transition: all 0.2s ease;
        }

        .new-chat-btn:hover {
            background: rgba(99, 102, 241, 0.15);
            border-color: rgba(99, 102, 241, 0.4);
            color: #ffffff;
        }

        /* Welcome Hero Center Section */
        .welcome-hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            margin: auto;
            width: 100%;
            max-width: 680px;
            padding: 2rem 1rem;
            animation: slideUp 0.4s ease-out;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .welcome-hero.hidden {
            display: none !important;
        }

        /* Animated Logo */
        .hero-logo-wrapper {
            position: relative;
            width: 110px;
            height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.8rem;
        }

        .logo-glow-bg {
            position: absolute;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.35) 0%, rgba(124, 58, 237, 0.1) 60%, transparent 75%);
            filter: blur(15px);
            animation: pulseGlow 4s ease-in-out infinite alternate;
        }

        .orbit-ring {
            position: absolute;
            border-radius: 50%;
            border: 2px solid transparent;
        }

        .orbit-ring.ring-1 {
            width: 100px;
            height: 100px;
            border-top-color: #6366f1;
            border-right-color: #818cf8;
            animation: spin 5s linear infinite;
            filter: drop-shadow(0 0 6px rgba(99, 102, 241, 0.6));
        }

        .orbit-ring.ring-2 {
            width: 80px;
            height: 80px;
            border-bottom-color: #a855f7;
            border-left-color: #c084fc;
            animation: spinRev 7s linear infinite;
            filter: drop-shadow(0 0 6px rgba(168, 85, 247, 0.6));
        }

        .orbit-ring.ring-3 {
            width: 60px;
            height: 60px;
            border-top-color: #38bdf8;
            border-left-color: #0284c7;
            animation: spin 9s linear infinite;
            filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.6));
        }

        .logo-core-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            box-shadow: 0 0 25px rgba(99, 102, 241, 0.8);
            z-index: 2;
            animation: floatLogo 3s ease-in-out infinite alternate;
        }

        .sparkle {
            position: absolute;
            font-size: 1rem;
            color: #a855f7;
            animation: sparkleFloat 2.5s ease-in-out infinite alternate;
            z-index: 3;
            pointer-events: none;
        }

        .sparkle.s1 { top: -5px; right: 10px; animation-delay: 0s; color: #818cf8; }
        .sparkle.s2 { bottom: 0px; left: 5px; animation-delay: 0.8s; color: #38bdf8; }
        .sparkle.s3 { top: 35px; right: -12px; animation-delay: 1.6s; color: #c084fc; }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes spinRev {
            0% { transform: rotate(360deg); }
            100% { transform: rotate(0deg); }
        }

        @keyframes pulseGlow {
            0% { transform: scale(0.95); opacity: 0.6; }
            100% { transform: scale(1.15); opacity: 1; }
        }

        @keyframes floatLogo {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-6px); }
        }

        @keyframes sparkleFloat {
            0% { transform: translateY(0) scale(0.8); opacity: 0.4; }
            100% { transform: translateY(-8px) scale(1.2); opacity: 1; }
        }

        /* Hero Content */
        .hero-heading {
            font-size: 1.85rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 0.6rem;
            letter-spacing: -0.02em;
            line-height: 1.3;
        }

        .gradient-text {
            background: linear-gradient(135deg, #818cf8 0%, #c084fc 50%, #38bdf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-subheading {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 1.8rem;
            max-width: 520px;
            line-height: 1.6;
        }

        /* Hero Center Search Box */
        .hero-search-container {
            width: 100%;
            max-width: 560px;
            margin-bottom: 1.8rem;
        }

        .hero-search-bar {
            display: flex;
            align-items: center;
            background: rgba(21, 28, 44, 0.85);
            border: 1px solid rgba(99, 102, 241, 0.35);
            border-radius: 16px;
            padding: 0.45rem 0.5rem 0.45rem 1.1rem;
            backdrop-filter: blur(12px);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4), 0 0 20px rgba(99, 102, 241, 0.15);
            transition: all 0.3s ease;
        }

        .hero-search-bar:focus-within, .hero-search-bar:hover {
            border-color: #818cf8;
            box-shadow: 0 14px 40px rgba(0, 0, 0, 0.5), 0 0 30px rgba(99, 102, 241, 0.3);
            transform: translateY(-2px);
        }

        .hero-search-icon {
            color: #818cf8;
            margin-right: 0.75rem;
            flex-shrink: 0;
        }

        .hero-search-bar input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-family: inherit;
            font-size: 0.98rem;
            padding: 0.4rem 0;
        }

        .hero-search-bar input::placeholder {
            color: #64748b;
        }

        .hero-submit-btn {
            display: flex;
            align-items: center;
            gap: 0.45rem;
            background: linear-gradient(135deg, #6366f1, #7c3aed);
            border: none;
            border-radius: 11px;
            color: #ffffff;
            font-family: inherit;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 0.65rem 1.25rem;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
            flex-shrink: 0;
        }

        .hero-submit-btn:hover {
            background: linear-gradient(135deg, #4f46e5, #6d28d9);
            transform: scale(1.02);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6);
        }

        /* Quick Suggestion Chips */
        .quick-prompts-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.8rem;
            width: 100%;
        }

        .prompts-label {
            font-size: 0.82rem;
            font-weight: 500;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .chips-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.65rem;
            max-width: 600px;
        }

        .prompt-chip {
            display: flex;
            align-items: center;
            gap: 0.45rem;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 0.55rem 1.05rem;
            color: #cbd5e1;
            font-family: inherit;
            font-size: 0.84rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.22s ease;
        }

        .prompt-chip:hover {
            background: rgba(99, 102, 241, 0.15);
            border-color: rgba(99, 102, 241, 0.4);
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.25);
        }

        .chip-emoji {
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <div class="brand-logo">SR</div>
            <div class="brand-title">
                <h1>Smart Research Portal</h1>
                <p>Knowledge Engine & Information Service</p>
            </div>
        </div>
        <button class="new-chat-btn" onclick="resetToHome()" title="Start New Research">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 5v14M5 12h14"/>
            </svg>
            <span>New Research</span>
        </button>
    </header>

    <div class="app-container">
        <div class="chat-box" id="chatBox">
            <!-- Center Welcome Hero (Visible when no search is active) -->
            <div class="welcome-hero" id="welcomeHero">
                <div class="hero-logo-wrapper">
                    <div class="logo-glow-bg"></div>
                    <div class="orbit-ring ring-1"></div>
                    <div class="orbit-ring ring-2"></div>
                    <div class="orbit-ring ring-3"></div>
                    <div class="logo-core-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"/>
                            <line x1="2" y1="12" x2="22" y2="12"/>
                            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
                        </svg>
                    </div>
                    <span class="sparkle s1">✦</span>
                    <span class="sparkle s2">✨</span>
                    <span class="sparkle s3">✦</span>
                </div>

                <h2 class="hero-heading">What would you like to <span class="gradient-text">research today?</span></h2>
                <p class="hero-subheading">Enter any topic or question below for instant AI synthesis, comprehensive summaries, and structured insights.</p>

                <!-- Center Search Box ("Search Here") -->
                <div class="hero-search-container">
                    <div class="hero-search-bar">
                        <svg class="hero-search-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        <input type="text" id="heroSearchInput" placeholder="Search here... (e.g., AI Breakthroughs, Quantum Computing)" onkeydown="handleHeroKey(event)">
                        <button class="hero-submit-btn" onclick="submitFromHero()">
                            <span>Search</span>
                            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Quick Prompts / Suggestions -->
                <div class="quick-prompts-section">
                    <span class="prompts-label">⚡ Popular Topics to Explore:</span>
                    <div class="chips-grid">
                        <button class="prompt-chip" onclick="quickSearch('Quantum Computing Advances')">
                            <span class="chip-emoji">⚛️</span> Quantum Computing
                        </button>
                        <button class="prompt-chip" onclick="quickSearch('Artificial General Intelligence Progress')">
                            <span class="chip-emoji">🤖</span> AI & Machine Learning
                        </button>
                        <button class="prompt-chip" onclick="quickSearch('CRISPR Gene Editing Innovations')">
                            <span class="chip-emoji">🧬</span> CRISPR Biotechnology
                        </button>
                        <button class="prompt-chip" onclick="quickSearch('Next-Gen Clean Energy & Fusion Power')">
                            <span class="chip-emoji">⚡</span> Clean Energy & Fusion
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="input-area">
            <textarea id="queryInput" placeholder="Type topic or question here... (Press Enter to send)" rows="1"></textarea>
            <button class="send-btn" id="sendBtn" onclick="submitQuery()">
                <svg viewBox="0 0 24 24">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                </svg>
            </button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chatBox');
        const queryInput = document.getElementById('queryInput');
        const heroSearchInput = document.getElementById('heroSearchInput');
        const welcomeHero = document.getElementById('welcomeHero');
        const sendBtn = document.getElementById('sendBtn');

        queryInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                submitQuery();
            }
        });

        function handleHeroKey(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                submitFromHero();
            }
        }

        function submitFromHero() {
            if (!heroSearchInput) return;
            const query = heroSearchInput.value.trim();
            if (query) {
                submitQuery(query);
            }
        }

        function quickSearch(text) {
            submitQuery(text);
        }

        function hideHero() {
            if (welcomeHero) {
                welcomeHero.classList.add('hidden');
            }
        }

        function resetToHome() {
            // Remove all chat messages except hero
            const msgRows = chatBox.querySelectorAll('.msg-row');
            msgRows.forEach(row => row.remove());

            if (welcomeHero) {
                welcomeHero.classList.remove('hidden');
            }
            if (queryInput) queryInput.value = '';
            if (heroSearchInput) heroSearchInput.value = '';
            queryInput.style.height = '24px';
        }

        async function submitQuery(overrideQuery) {
            const query = (overrideQuery || queryInput.value).trim();
            if (!query) return;

            hideHero();
            appendUserMessage(query);

            queryInput.value = '';
            if (heroSearchInput) heroSearchInput.value = '';
            queryInput.style.height = '24px';

            const loadingId = appendLoadingIndicator();
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                sendBtn.disabled = true;

                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: query })
                });

                const data = await res.json();
                removeElement(loadingId);

                if (data.status === 'success') {
                    appendAssistantMessage(data.response);
                } else {
                    const errText = data.error || "Failed to process request.";
                    const retryBtnHtml = `\n\n<div style="margin-top: 10px;"><button class="prompt-chip" style="display:inline-flex;" onclick="quickSearch('${escapeHtml(query)}')">🔄 Retry Research</button></div>`;
                    appendAssistantMessage("⚠️ **Service Notice:** " + errText + retryBtnHtml);
                }
            } catch (err) {
                removeElement(loadingId);
                const retryBtnHtml = `\n\n<div style="margin-top: 10px;"><button class="prompt-chip" style="display:inline-flex;" onclick="quickSearch('${escapeHtml(query)}')">🔄 Retry Connection</button></div>`;
                appendAssistantMessage("⚠️ **Server Connection Issue:** Please ensure the Java server is running or try again." + retryBtnHtml);
            } finally {
                sendBtn.disabled = false;
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }

        function appendUserMessage(text) {
            const div = document.createElement('div');
            div.className = 'msg-row user';
            div.innerHTML = `
                <div class="msg-content">${escapeHtml(text)}</div>
                <div class="avatar">You</div>
            `;
            chatBox.appendChild(div);
        }

        function appendAssistantMessage(text) {
            const div = document.createElement('div');
            div.className = 'msg-row assistant';
            
            const formattedText = formatMarkdown(text);
            const msgId = 'msg-' + Date.now();

            div.innerHTML = `
                <div class="avatar">SR</div>
                <div class="msg-content" id="${msgId}">
                    <div class="res-header">
                        <span class="res-tag">Research Summary</span>
                        <button class="copy-btn" onclick="copyText('${msgId}')">📋 Copy</button>
                    </div>
                    <div class="res-body">${formattedText}</div>
                </div>
            `;
            chatBox.appendChild(div);
        }

        let loaderInterval = null;

        function appendLoadingIndicator() {
            const id = 'loader-' + Date.now();
            const div = document.createElement('div');
            div.className = 'msg-row assistant';
            div.id = id;
            div.innerHTML = `
                <div class="avatar">SR</div>
                <div class="msg-content">
                    <div class="loader-container">
                        <span id="loader-label">⚡ Fast-analyzing research data...</span>
                        <div class="typing-dots">
                            <span></span><span></span><span></span>
                        </div>
                    </div>
                </div>
            `;
            chatBox.appendChild(div);

            const steps = [
                "⚡ Fast-analyzing research data...",
                "🔍 Extracting key facts & metrics...",
                "📊 Synthesizing concise report..."
            ];
            let stepIdx = 0;
            loaderInterval = setInterval(() => {
                stepIdx = (stepIdx + 1) % steps.length;
                const lbl = document.getElementById('loader-label');
                if (lbl) lbl.textContent = steps[stepIdx];
            }, 700);

            return id;
        }

        function removeElement(id) {
            if (loaderInterval) {
                clearInterval(loaderInterval);
                loaderInterval = null;
            }
            const target = document.getElementById(id);
            if (target) target.remove();
        }

        function copyText(msgId) {
            const container = document.getElementById(msgId);
            if (!container) return;
            const body = container.querySelector('.res-body');
            if (body) {
                navigator.clipboard.writeText(body.innerText);
                const btn = container.querySelector('.copy-btn');
                if (btn) {
                    btn.innerText = "✓ Copied";
                    setTimeout(() => btn.innerText = "📋 Copy", 2000);
                }
            }
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function formatMarkdown(text) {
            let html = escapeHtml(text);
            html = html.replace(/^- (.*)$/gm, '<li>$1</li>');
            html = html.replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>');
            html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/\n/g, '<br>');
            return html;
        }
    </script>
</body>
</html>
